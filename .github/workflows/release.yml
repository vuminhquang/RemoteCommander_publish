# A tag vX.Y.Z on the publish branch: check the tree, run every binary on
# its own OS, then STAGE the version on npm with trusted publishing (OIDC,
# provenance). The owner approves it with 2FA (`npm stage approve <id>`);
# CI can never put a version live by itself.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/guard.sh
      - name: Tag matches the package version
        run: |
          version="$(node -p "require('./packages/remote-commander/package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, packages $version"; exit 1; }

  smoke:
    needs: guard
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,    pkg: linux-x64 }
          - { os: ubuntu-24.04-arm, pkg: linux-arm64 }
          - { os: macos-latest,     pkg: darwin-arm64 }
          - { os: macos-15-intel,   pkg: darwin-x64 }
          - { os: windows-latest,   pkg: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: The binary runs here, through the launcher
        shell: bash
        run: |
          dir="packages/remote-commander/bin/${{ matrix.pkg }}"
          [ -d "$dir" ] || { echo "::warning::no $dir in this release"; exit 0; }
          chmod +x "$dir"/* || true
          "$dir"/remote-commander-mcp* --version
          work="$(mktemp -d)"
          (cd packages/remote-commander && npm pack --pack-destination "$work" >/dev/null)
          cd "$work" && npm init -y >/dev/null
          npm install --no-audit --no-fund ./remote-commander-*.tgz
          npx remote-commander --version

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        run: npm install -g npm@latest
      - name: Stage remote-commander for the owner's 2FA approval
        shell: bash
        working-directory: packages/remote-commander
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "remote-commander@$version" version >/dev/null 2>&1; then
            echo "remote-commander@$version already published"
            exit 0
          fi
          npm stage publish --provenance --access public
